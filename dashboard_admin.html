<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Demo</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            overflow: hidden;
        }

        /* Dashboard layout */
        .dashboard-container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 250px;
            background: #111;
            padding: 2rem;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
        }

        .sidebar-link {
            display: block;
            padding: 1rem;
            color: var(--text-muted);
            border-radius: 8px;
            margin-bottom: 0.5rem;
        }

        .sidebar-link:hover,
        .sidebar-link.active {
            background: var(--accent-color);
            color: white;
        }

        .main-content {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
            background: #0a0a0a;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: #1a1a1a;
            padding: 1.5rem;
            border-radius: 15px;
            border: 1px solid #333;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            margin: 0.5rem 0;
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .chart-placeholder {
            height: 300px;
            background: #1a1a1a;
            border-radius: 15px;
            border: 1px solid #333;
            display: flex;
            align-items: flex-end;
            padding: 2rem;
            gap: 1rem;
        }

        .bar {
            flex: 1;
            background: var(--accent-gradient);
            border-radius: 5px 5px 0 0;
            opacity: 0.7;
            transition: height 1s ease;
        }

        .back-link {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--accent-color);
            padding: 10px 20px;
            border-radius: 50px;
            z-index: 100;
        }
    </style>
</head>

<body>
    <a href="index.html" class="back-link">← Volver al Portafolio</a>

    <div class="dashboard-container">
        <aside class="sidebar">
            <h2 style="margin-bottom: 2rem;">ADMIN.</h2>
            <a href="#" class="sidebar-link active">Dashboard</a>
            <a href="#" class="sidebar-link">Usuarios</a>
            <a href="#" class="sidebar-link">Ventas</a>
            <a href="#" class="sidebar-link">Analíticas</a>
            <a href="#" class="sidebar-link" style="margin-top: auto;">Configuración</a>
        </aside>

        <main class="main-content">
            <h1 style="margin-bottom: 2rem;">Resumen General</h1>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Ingresos Totales</div>
                    <div class="stat-value">$45,231</div>
                    <div style="color: #4ade80;">+12.5% ↗</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Usuarios Activos</div>
                    <div class="stat-value">1,204</div>
                    <div style="color: #4ade80;">+5.2% ↗</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Nuevos Pedidos</div>
                    <div class="stat-value">342</div>
                    <div style="color: #f87171;">-2.1% ↘</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Tasa de Rebote</div>
                    <div class="stat-value">24.5%</div>
                    <div style="color: #4ade80;">-0.5% ↗</div>
                </div>
            </div>

            <div class="chart-placeholder">
                <!-- Simple CSS Bar Chart -->
                <div class="bar" style="height: 40%;"></div>
                <div class="bar" style="height: 70%;"></div>
                <div class="bar" style="height: 50%;"></div>
                <div class="bar" style="height: 90%;"></div>
                <div class="bar" style="height: 60%;"></div>
                <div class="bar" style="height: 80%;"></div>
                <div class="bar" style="height: 45%;"></div>
            </div>
        </main>
    </div>
</body>

</html>
