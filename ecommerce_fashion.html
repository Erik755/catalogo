<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moda Exclusiva | Demo E-commerce</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Specific styles for this demo */
        .demo-nav {
            background: #000;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .demo-hero {
            height: 60vh;
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('ecommerce_fashion.png') no-repeat center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            padding: 4rem 2rem;
        }

        .product-card {
            background: #1a1a1a;
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
        }

        .product-image {
            width: 100%;
            height: 300px;
            background: #333;
            object-fit: cover;
            margin-bottom: 1rem;
        }

        .price {
            color: var(--accent-color);
            font-size: 1.2rem;
            font-weight: bold;
        }

        .back-link {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--accent-color);
            padding: 10px 20px;
            border-radius: 50px;
            z-index: 100;
        }
    </style>
</head>

<body>
    <a href="index.html" class="back-link">← Volver al Portafolio</a>

    <nav class="demo-nav">
        <div class="logo">LUXE.</div>
        <div class="nav-links">
            <a href="#">Hombre</a>
            <a href="#">Mujer</a>
            <a href="#">Accesorios</a>
            <a href="#" onclick="alert('Carrito vacío')">🛒 (0)</a>
        </div>
    </nav>

    <header class="demo-hero">
        <div>
            <h1 class="hero-title" style="font-size: 3rem;">Nueva Colección 2025</h1>
            <button class="btn btn-primary"
                onclick="document.querySelector('.product-grid').scrollIntoView({behavior: 'smooth'})">Comprar
                Ahora</button>
        </div>
    </header>

    <section class="container">
        <div class="product-grid">
            <div class="product-card">
                <div class="product-image" style="background: #222;"></div>
                <h3>Chaqueta Urbana</h3>
                <p class="price">$129.99</p>
                <button class="btn btn-secondary" onclick="alert('Añadido al carrito')">Añadir</button>
            </div>
            <div class="product-card">
                <div class="product-image" style="background: #252525;"></div>
                <h3>Pantalón Cargo</h3>
                <p class="price">$89.99</p>
                <button class="btn btn-secondary" onclick="alert('Añadido al carrito')">Añadir</button>
            </div>
            <div class="product-card">
                <div class="product-image" style="background: #282828;"></div>
                <h3>Sneakers Limited</h3>
                <p class="price">$199.99</p>
                <button class="btn btn-secondary" onclick="alert('Añadido al carrito')">Añadir</button>
            </div>
            <div class="product-card">
                <div class="product-image" style="background: #2a2a2a;"></div>
                <h3>Bolso de Cuero</h3>
                <p class="price">$149.99</p>
                <button class="btn btn-secondary" onclick="alert('Añadido al carrito')">Añadir</button>
            </div>
        </div>
    </section>

    <footer class="footer">
        <p>Demo creada por Erik Sanchez</p>
    </footer>
</body>

</html>
