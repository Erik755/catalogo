<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopDemo | Premium E-commerce</title>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #222;
            --accent: #ff5f56;
            --bg: #fff;
            --text: #444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Jost', sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            cursor: none;
            /* Hide default cursor */
        }

        /* Custom Cursor */
        .cursor-dot,
        .cursor-outline {
            position: fixed;
            top: 0;
            left: 0;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            z-index: 9999;
            pointer-events: none;
        }

        .cursor-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent);
        }

        .cursor-outline {
            width: 40px;
            height: 40px;
            border: 1px solid var(--accent);
            transition: width 0.2s, height 0.2s, background-color 0.2s;
        }

        /* Header */
        header {
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            position: sticky;
            top: 0;
            background: #fff;
            z-index: 10;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
        }

        .nav-icons {
            display: flex;
            gap: 1.5rem;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .cart-icon {
            position: relative;
        }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--accent);
            color: white;
            font-size: 0.7rem;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        /* Hero */
        .hero {
            background: #f4f4f4;
            padding: 4rem 2rem;
            text-align: center;
            margin-bottom: 2rem;
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: var(--primary);
        }

        .hero p {
            margin-bottom: 2rem;
            color: #666;
        }

        .btn {
            padding: 10px 25px;
            background: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            background: var(--accent);
        }

        /* Filters */
        .filters {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .filter-btn {
            background: none;
            border: 1px solid #ddd;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 20px;
            transition: 0.3s;
        }

        .filter-btn.active,
        .filter-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 2rem;
            padding: 0 2rem 4rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .product-card {
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .img-container {
            height: 300px;
            background: #f9f9f9;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            position: relative;
        }

        .img-container img {
            max-height: 80%;
            max-width: 80%;
            object-fit: contain;
            mix-blend-mode: multiply;
        }

        .product-info {
            text-align: center;
        }

        .product-title {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--primary);
        }

        .product-price {
            color: var(--accent);
            font-weight: 600;
        }

        .add-btn {
            position: absolute;
            bottom: -50px;
            left: 0;
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .product-card:hover .add-btn {
            bottom: 0;
        }

        .add-btn:hover {
            background: var(--accent);
        }

        /* Cart Sidebar */
        .cart-sidebar {
            position: fixed;
            top: 0;
            right: -400px;
            width: 350px;
            height: 100%;
            background: white;
            box-shadow: -5px 0 15px rgba(0, 0, 0, 0.1);
            z-index: 100;
            transition: 0.3s ease;
            padding: 2rem;
            display: flex;
            flex-direction: column;
        }

        .cart-sidebar.open {
            right: 0;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 1rem;
        }

        .close-cart {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
        }

        .cart-item {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid #f5f5f5;
            padding-bottom: 1rem;
        }

        .cart-item img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            background: #f9f9f9;
        }

        .cart-total {
            margin-top: auto;
            border-top: 1px solid #eee;
            padding-top: 1rem;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 1rem;
        }

        .checkout-btn {
            width: 100%;
            padding: 15px;
            background: var(--accent);
            color: white;
            border: none;
            font-weight: 600;
            cursor: pointer;
        }

        /* Notification */
        .notification {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #222;
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            opacity: 0;
            transition: 0.3s;
            pointer-events: none;
        }

        .notification.show {
            opacity: 1;
            bottom: 40px;
        }
    </style>
</head>

<body>
    <div class="cursor-dot" id="cursor-dot"></div>
    <div class="cursor-outline" id="cursor-outline"></div>

    <header>
        <a href="#" class="logo">SHOP.</a>
        <div class="nav-icons">
            <i class="fa-solid fa-magnifying-glass"></i>
            <i class="fa-regular fa-heart"></i>
            <div class="cart-icon" onclick="toggleCart()">
                <i class="fa-solid fa-bag-shopping"></i>
                <span class="cart-count">0</span>
            </div>
        </div>
    </header>

    <section class="hero">
        <h1>Summer Collection 2025</h1>
        <p>Minimalist essentials for the modern wardrobe.</p>
        <button class="btn">Shop Now</button>
    </section>

    <div class="filters">
        <button class="filter-btn active" onclick="filterProducts('all')">All</button>
        <button class="filter-btn" onclick="filterProducts('clothing')">Clothing</button>
        <button class="filter-btn" onclick="filterProducts('accessories')">Accessories</button>
        <button class="filter-btn" onclick="filterProducts('shoes')">Shoes</button>
    </div>

    <div class="product-grid" id="product-grid">
        <!-- Products injected via JS -->
    </div>

    <!-- Cart Sidebar -->
    <div class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h3>Shopping Bag</h3>
            <button class="close-cart" onclick="toggleCart()">&times;</button>
        </div>
        <div class="cart-items" id="cart-items">
            <!-- Cart items -->
            <p style="text-align: center; color: #999; margin-top: 2rem;">Your bag is empty.</p>
        </div>
        <div class="cart-total">
            <div class="total-row">
                <span>Total</span>
                <span id="cart-total-price">$0.00</span>
            </div>
            <button class="checkout-btn" onclick="alert('Checkout simulation: Payment processed!')">CHECKOUT</button>
        </div>
    </div>

    <div class="notification" id="notification">Item added to cart</div>

    <script>
        // Custom Cursor Logic
        const cursorDot = document.getElementById('cursor-dot');
        const cursorOutline = document.getElementById('cursor-outline');

        window.addEventListener('mousemove', (e) => {
            const posX = e.clientX;
            const posY = e.clientY;

            cursorDot.style.left = `${posX}px`;
            cursorDot.style.top = `${posY}px`;

            cursorOutline.animate({
                left: `${posX}px`,
                top: `${posY}px`
            }, { duration: 500, fill: "forwards" });
        });

        const products = [
            { id: 1, name: "Classic White Tee", price: 25.00, category: "clothing", image: "assets/tee.png" },
            { id: 2, name: "Denim Jacket", price: 85.00, category: "clothing", image: "https://images.unsplash.com/photo-1576871337622-98d48d1cf531?w=500&auto=format&fit=crop&q=60" },
            { id: 3, name: "Urban Sneakers", price: 120.00, category: "shoes", image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500&auto=format&fit=crop&q=60" },
            { id: 4, name: "Leather Backpack", price: 150.00, category: "accessories", image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=500&auto=format&fit=crop&q=60" },
            { id: 5, name: "Minimalist Watch", price: 95.00, category: "accessories", image: "https://images.unsplash.com/photo-1524592094714-0f0654e20314?w=500&auto=format&fit=crop&q=60" },
            { id: 6, name: "Summer Shorts", price: 45.00, category: "clothing", image: "https://images.unsplash.com/photo-1591195853828-11db59a44f6b?w=500&auto=format&fit=crop&q=60" },
        ];

        let cart = [];

        function renderProducts(filter = 'all') {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';

            const filtered = filter === 'all' ? products : products.filter(p => p.category === filter);

            filtered.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="img-container">
                        <img src="${product.image}" alt="${product.name}">
                        <button class="add-btn" onclick="addToCart(${product.id})">ADD TO CART</button>
                    </div>
                    <div class="product-info">
                        <div class="product-title">${product.name}</div>
                        <div class="product-price">$${product.price.toFixed(2)}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterProducts(category) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderProducts(category);
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            cart.push(product);
            updateCart();
            showNotification();
            toggleCart(true); // Open cart to show item added
        }

        function updateCart() {
            const cartItems = document.getElementById('cart-items');
            const count = document.querySelector('.cart-count');
            const totalEl = document.getElementById('cart-total-price');

            count.textContent = cart.length;

            let total = 0;
            if (cart.length === 0) {
                cartItems.innerHTML = '<p style="text-align: center; color: #999; margin-top: 2rem;">Your bag is empty.</p>';
            } else {
                cartItems.innerHTML = '';
                cart.forEach((item, index) => {
                    total += item.price;
                    const div = document.createElement('div');
                    div.className = 'cart-item';
                    div.innerHTML = `
                        <img src="${item.image}" alt="${item.name}">
                        <div>
                            <div style="font-weight: 600;">${item.name}</div>
                            <div style="color: #666;">$${item.price.toFixed(2)}</div>
                            <button onclick="removeFromCart(${index})" style="background:none; border:none; color:red; font-size:0.8rem; cursor:pointer; margin-top:5px;">Remove</button>
                        </div>
                    `;
                    cartItems.appendChild(div);
                });
            }
            totalEl.textContent = '$' + total.toFixed(2);
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCart();
        }

        function toggleCart(forceOpen = false) {
            const sidebar = document.getElementById('cart-sidebar');
            if (forceOpen) {
                sidebar.classList.add('open');
            } else {
                sidebar.classList.toggle('open');
            }
        }

        function showNotification() {
            const notif = document.getElementById('notification');
            notif.classList.add('show');
            setTimeout(() => {
                notif.classList.remove('show');
            }, 2000);
        }

        // Initial render
        renderProducts();
    </script>
</body>

</html>
